# Встроенный (внутрь bootx64/bootia32.efi) конфиг GRUB для UEFI. Делает одно:
# находит раздел с ядром и отдаёт управление РЕДАКТИРУЕМОМУ grub.cfg на нём
# (FAT флешки / корень ISO) — там записи kms/safe, как в syslinux.cfg для
# BIOS. Так режим видео переключается без пересборки и на UEFI-машинах.
# Фолбэк без grub.cfg — прямой старт (kms).
set timeout=0
# ВАЖНО: search перебирает только УЖЕ загруженные файловые системы (autoload
# работает для команд, не для probe) — без этих insmod он не находит раздел,
# root остаётся (memdisk) и загрузка падает в grub> (так UEFI-путь и не
# работал до v1.4.1; машины грузились через Legacy/CSM).
insmod part_msdos
insmod part_gpt
insmod fat
insmod iso9660
search --no-floppy --set=root --file /bzImage
if [ -f ($root)/grub.cfg ]; then
    configfile ($root)/grub.cfg
fi
linux ($root)/bzImage console=tty2 vt.default_utf8=1 quiet loglevel=1 consoleblank=600 i915.enable_fbc=0
initrd ($root)/initrd.gz
boot
