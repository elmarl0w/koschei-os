# GRUB-меню UEFI-загрузки (BIOS-путь — syslinux.cfg рядом). Лежит на флешке:
# правится на любом компе или через tc-edit grub.cfg, пересборка не нужна.
# default: kms (штатно, нативное разрешение через KMS-драйвер) или safe
# (i915 не трогает GPU, экран через simpledrm из GOP-буфера прошивки).
# vga= под UEFI не нужен — консоль рисует GOP-framebuffer.
set timeout=0
set default=kms

menuentry 'kms'  --id kms {
    linux  /bzImage console=tty2 vt.default_utf8=1 quiet loglevel=1 consoleblank=600 i915.enable_fbc=0
    initrd /initrd.gz
}
menuentry 'safe' --id safe {
    linux  /bzImage console=tty2 vt.default_utf8=1 quiet loglevel=1 consoleblank=600 i915.modeset=0
    initrd /initrd.gz
}
