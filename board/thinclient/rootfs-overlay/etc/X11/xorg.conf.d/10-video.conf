# Общие флаги X-сервера тонкого клиента.
#
# Секции "Device" (какой драйвер) здесь НЕТ — её генерит /usr/bin/tc-xconf
# в 20-device.conf перед каждым стартом X по ключу tc.conf XDRIVER
# (auto|modesetting|intel|fbdev) и по факту наличия /dev/dri/card0.
# История: на живом Intel Pineview/GMA3150 (Atom D4xx/D5xx) штатный KMS-путь
# (modesetting поверх i915) вешал машину намертво при работе с экраном — даже
# с софт-курсором. Поэтому драйвер стал переключаемым без пересборки, а для
# такого железа есть режим ядра "safe" (nomodeset -> VESA-фреймбуфер, X fbdev,
# GPU не получает ни одной команды) — см. syslinux.cfg и docs/RUNBOOK.md 5.6.

# Предзагрузка вспомогательных модулей X. Buildroot линкует драйверы с
# полным RELRO (-z now, в ELF: FLAGS_1 NOW), поэтому dlopen драйвера требует
# ВСЕ его символы сразу — а fbdevhw/shadow X штатно подгружает уже ПОСЛЕ
# драйвера, как сабмодули. Итог без этой секции: fbdev_drv.so падает с
# "undefined symbol: fbdevHWSave" -> "No drivers available" -> "no screens
# found" (ровно то, что раньше ловили на живом D525 и списали на отсутствие
# /dev/fb0). Загруженный заранее модуль виден драйверу (RTLD_GLOBAL).
# Кому что нужно (nm -D --undefined-only по драйверам сборки):
#   fbdev_drv  -> fbdevhw, shadow;   intel_drv -> vgahw, int10;
#   modesetting -> ничего. Модули маленькие, предзагрузка всех безвредна.
Section "Module"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
    Load "vgahw"
    Load "int10"
EndSection

# Киоск: из полноэкранной RDP-сессии нельзя переключить VT (Ctrl+Alt+F1..F6)
# и убить X (Ctrl+Alt+Backspace). tty2 остаётся доступен из МЕНЮ, не из
# сессии. Грязный выход X страхует `chvt 1` в tc-menu.
# BlankTime/Standby/Suspend/Off = 0: экран НИКОГДА не гасится ни скринсейвером,
# ни DPMS — киоск с RDP-сессией должен быть виден всегда (у старых панелей
# DPMS-пробуждение тоже бывает сломано — проще не гасить вовсе).
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
EndSection
