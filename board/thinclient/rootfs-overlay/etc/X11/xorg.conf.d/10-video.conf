# Драйвер X для тонкого клиента.
#
# Основная цель — старые Intel Atom (N270/945GSE, D525/Pineview-GMA3150,
# Cedar Trail): графика поднимается KMS-драйвером i915 -> узел /dev/dri/card0.
# Поэтому X ведём штатным "modesetting" (KMS), а НЕ "fbdev": fbdev требует
# /dev/fb0, которого при чистом KMS может не быть, и X падает с
# "no screens found" (ровно это ловили на живом D525; в UTM с простым
# VESA-framebuffer fbdev работал — оттого и не всплывало).
#
# AccelMethod none: отключаем glamor/ускорение. RDP-клиенту ускорение не нужно
# (полноэкранный блит), а glamor на части карт (nouveau) вешает X чёрным
# экраном — раньше именно от этого уходили в fbdev; с modesetting+none этой
# проблемы нет, и при этом работает реальный Intel.
#
# modesetting встроен в xorg-server и работает на i915/amdgpu/radeon/nouveau и
# виртуальных GPU (bochs/qxl/vmwgfx/virtio) — то есть на всех наших целях.
# Совсем древняя машина без KMS (только VESA): админ меняет Driver на "fbdev"
# (пакет в образе есть) и грузится с vga= (см. docs/RUNBOOK.md).
Section "Device"
    Identifier "gpu"
    Driver "modesetting"
    Option "AccelMethod" "none"
    # SWcursor: НЕ трогать аппаратный курсор KMS. На старых Intel GMA
    # (Pineview/GMA3150 на D525 и др.) операция с cursor-plane при первом
    # движении мыши валит дисплей — экран гаснет, хотя RDP-сессия жива.
    # Софт-курсор рисуется как обычная графика, cursor-plane не задействован.
    Option "SWcursor" "true"
EndSection

# Киоск: из полноэкранной RDP-сессии нельзя переключить VT (Ctrl+Alt+F1..F6)
# и убить X (Ctrl+Alt+Backspace). tty2 остаётся доступен из МЕНЮ, не из
# сессии. Грязный выход X страхует `chvt 1` в tc-menu.
# BlankTime/Standby/Suspend/Off = 0: экран НИКОГДА не гасится ни скринсейвером,
# ни DPMS — киоск с RDP-сессией должен быть виден всегда (у старых панелей
# DPMS-пробуждение тоже бывает сломано — проще не гасить вовсе).
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
EndSection
