# DEFAULT: kms (штатно) или safe — подставляется при сборке из site.env
# (VIDEO_MODE=kms|safe). Можно поменять и руками: файл лежит на FAT-разделе
# флешки, пересборка не нужна.
DEFAULT kms
PROMPT 0
# NOESCAPE/ALLOWOPTIONS: запретить интерактивный boot: и правку cmdline —
# иначе у машины у стойки можно набрать `kms init=/bin/sh` и получить
# root без пароля, минуя всё меню. Recovery чёрного экрана (правка vga=,
# выбор safe) — только редактированием этого файла на загрузочном разделе
# с другого компьютера — см. docs/RUNBOOK.md.
NOESCAPE 1
ALLOWOPTIONS 0
TIMEOUT 10

# Общее для обоих режимов:
#   console=tty2: весь текст загрузки уходит на отладочную консоль,
#   tty1 остаётся чистым — заставка psplash, потом меню.
#   vga=791: VESA 1024x768 вместо текстового 80x25 на железе без
#   KMS-драйвера (иначе интерфейс гигантский); KMS, если есть,
#   всё равно переключит в нативное разрешение монитора.
#   consoleblank=600: гасить экран консоли (меню) после 10 мин простоя —
#   энергосбережение/защита панели; любая клавиша будит.

# kms — штатный режим: i915/amdgpu/nouveau поднимают нативное разрешение.
# i915.enable_fbc=0: компрессия фреймбуфера — известный источник зависаний
# на старых Intel GMA; RDP-клиенту она ничего не даёт.
LABEL kms
    KERNEL /bzImage
    INITRD /initrd.gz
    APPEND console=tty2 vt.default_utf8=1 quiet loglevel=1 vga=791 consoleblank=600 i915.enable_fbc=0

# safe — nomodeset: KMS-драйверы не загружаются вовсе, экран = VESA-фреймбуфер
# из vga=791, X работает через fbdev без единой команды GPU. Для железа, где
# i915 виснет намертво (Intel Pineview/GMA3150: Atom D4xx/D5xx). Цена —
# разрешение VESA (1024x768; другие коды: 794=1280x1024, 792=1024x768x24).
LABEL safe
    KERNEL /bzImage
    INITRD /initrd.gz
    APPEND console=tty2 vt.default_utf8=1 quiet loglevel=1 vga=791 consoleblank=600 nomodeset
